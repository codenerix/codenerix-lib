name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel older runs of the same ref when a new one arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every uv call must match uv.lock, including the ones inside `make` targets
env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        # One cache key per job: they all ran on the same system Python, raced
        # to save a single key and logged "Unable to reserve cache"
        with:
          cache-suffix: lint
      - name: Sync (dev)
        run: uv sync --locked
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format --check
        run: uv run --locked ruff format --check .

  types:
    name: Type check (mypy + basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          cache-suffix: types
      - name: Sync (dev)
        run: uv sync --locked
      - name: mypy
        run: uv run --locked mypy codenerix_lib
      - name: basedpyright
        run: uv run --locked basedpyright codenerix_lib

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          cache-suffix: py${{ matrix.python-version }}
      - name: Sync (dev)
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: NLTK stopwords corpus
        run: make stopwords
      - name: pytest (with coverage)
        run: uv run --locked coverage run -m pytest
      # Coverage gate and upload from a single interpreter, like the old tox
      # `coverage` env and the old workflow's Codecov step
      - name: Coverage report
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked coverage report -m --skip-covered --fail-under=90
          uv run --locked coverage xml
      # v6: v5 still pulls actions/github-script on Node 20.
      # Public repos can upload without a token if the Codecov org allows it;
      # otherwise add a CODECOV_TOKEN secret. Never blocks CI.
      - name: Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
