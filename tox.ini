[tox]
# tox-uv creates the envs with uv, which also fetches missing interpreters
requires =
    tox>=4
    tox-uv
envlist = py310,py311,py312,py313,coverage

[testenv]
deps = -rrequirements-dev.txt
# normalizers no longer downloads NLTK data by itself. The downloader exits 0
# even when the download fails, so the find() check is what fails the run
commands_pre =
    python -m nltk.downloader -q stopwords
    python -c "import nltk; nltk.data.find('corpora/stopwords')"
commands =
    python -m coverage run -p -m pytest tests/

[testenv:coverage]
basepython = python3.12
commands_pre =
commands = 
    python -m coverage combine
    python -m coverage report -m --skip-covered --fail-under=90
    python -m coverage xml
