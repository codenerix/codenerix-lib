[tox]
# tox-uv creates the envs with uv, which also fetches missing interpreters
requires =
    tox>=4
    tox-uv
envlist = py310,py311,py312,py313,py314,coverage

[testenv]
# Install the dev group from uv.lock, so every env tests the locked versions
runner = uv-venv-lock-runner
dependency_groups = dev
# normalizers does not download NLTK data by itself. The downloader exits 0
# even when the download fails, so the find() check is what fails the run
commands_pre =
    python -m nltk.downloader -q stopwords
    python -c "import nltk; nltk.data.find('corpora/stopwords')"
commands =
    python -m coverage run -p -m pytest {posargs}

[testenv:coverage]
basepython = python3.12
commands_pre =
commands =
    python -m coverage combine
    python -m coverage report -m --skip-covered --fail-under=90
    python -m coverage xml
