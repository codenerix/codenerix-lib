[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codenerix-lib"
dynamic = ["version"]
description = "Basic libraries used by CODENERIX."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Juanmi Taboada", email = "juanmi@juanmitaboada.com" },
]
keywords = ["codenerix"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
# Loose on purpose: consumers get the latest compatible releases; uv.lock pins
# the versions this repo is tested against.
dependencies = [
    "colorama",
    "nltk",
    "pycryptodomex",
    "textnorm",
    "unidecode",
]

[project.urls]
Homepage = "https://github.com/codenerix/codenerix-lib"
Source = "https://github.com/codenerix/codenerix-lib"
Changelog = "https://github.com/codenerix/codenerix-lib/blob/master/CHANGELOG"

# ----------------------------------------------------------------------------
# Dev dependencies (PEP 735). Installed by default with `uv sync`.
# Aligned with django-codenerix.
# ----------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pre-commit",
    # ruff pinned to match the ruff-pre-commit mirror rev so `uv run ruff` and
    # the hook never diverge.
    "ruff==0.14.5",
    "mypy",
    "basedpyright",
    # tox matrix across Python versions; uv backend for env creation
    "tox",
    "tox-uv",
    # Pytest stack
    "pytest>=9",
    "pytest-mock",
    "pytest-sugar",
    "coverage",
    # Markdown lint
    "pymarkdownlnt",
    # Type stubs (used by mypy)
    "types-colorama",
]

# ----------------------------------------------------------------------------
# Ruff — linter and formatter (same rules as django-codenerix)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E, W: pycodestyle | F: pyflakes | B: bugbear | I: isort
# UP: pyupgrade | COM: flake8-commas
select = ["E", "F", "W", "B", "I", "UP", "COM"]
ignore = [
    # ruff-format handles trailing commas; disable the conflicting rule.
    "COM812",
    # ruff-format owns line length; E501 only fires on unsplittable lines.
    "E501",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
line-ending = "auto"

# ----------------------------------------------------------------------------
# Pytest (moved from pytest.ini)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra -q"
python_files = ["tests_*.py"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

# ----------------------------------------------------------------------------
# Type checkers
# ----------------------------------------------------------------------------
[tool.mypy]
python_version       = "3.10"
follow_imports       = "normal"
warn_redundant_casts = true
warn_unused_ignores  = true

# Third-party deps that ship neither stubs nor a py.typed marker.
[[tool.mypy.overrides]]
module = [
    "nltk.*",
    "textnorm.*",
]
ignore_missing_imports = true

[tool.pyright]
venvPath         = "."
venv             = ".venv"
pythonVersion    = "3.10"
typeCheckingMode = "standard"
include          = ["codenerix_lib"]

[tool.pymarkdown]
# MD013 (line-length) is noise for prose; everything else stays on.
plugins.md013.enabled = false

# ----------------------------------------------------------------------------
# Build
# ----------------------------------------------------------------------------
[tool.hatch.version]
path = "codenerix_lib/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["codenerix_lib"]

[tool.hatch.build.targets.sdist]
only-include = ["codenerix_lib", "tests", "README.md", "CHANGELOG", "LICENSE"]
